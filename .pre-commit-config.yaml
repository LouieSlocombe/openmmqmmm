# Local mirror of the CI lint gate:
#   pip install -e '.[dev]' && pre-commit install     # once, per checkout
#   pre-commit run --all-files                        # check the whole tree
#
# The ruff rev must match ci.yml and the `dev` extra in pyproject.toml.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Whitespace hygiene for the files ruff never sees (YAML, TOML, Markdown).
  # The test data directories are excluded because the parser tests compare against
  # them byte-for-byte, and real ORCA output carries trailing whitespace.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^tests/(orca_outputs|extra_files|pdbfiles|xyzfiles)/
      - id: end-of-file-fixer
        exclude: ^tests/(orca_outputs|extra_files|pdbfiles|xyzfiles)/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/(orca_outputs|extra_files|pdbfiles|xyzfiles)/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
