#   conda env create -f environment.yml && conda activate openmmqmmm && pip install -e .
#   pip install --no-deps "forcefill @ git+https://github.com/LouieSlocombe/forcefill.git"
#
# ORCA is not packaged here — install it separately and set OPENMMQMMM_ORCADIR. See README.md.
name: openmmqmmm
channels:
  - conda-forge
dependencies:
  # The OpenMM stack comes from conda-forge (pdbfixer's only binary route)
  - python>=3.10
  - pip
  # Atomic Simulation Environment integration
  - ase
  - openmm =8.5.2
  # conda-forge's openmm-plumed binary requires OpenMM <8.5. These packages
  # support the latest GitHub master source build documented in README.md.
  - plumed =2.9.2
  - cmake
  - make
  - swig
  - cxx-compiler
  - pdbfixer
  - mdtraj
  - numpy
  - scipy
  - packaging
  # Amber/CHARMM/GROMACS topology handling in OpenMMTheory
  - parmed
  # forcefill's dependency stack (openmm_modeller parameterize_nonstandard=True; see README.md).
  # forcefill itself is not on PyPI or conda-forge — install it with the pip command above.
  # openff-toolkit pulls ambertools (antechamber for the GAFF backend), which pulls
  # pytorch + CUDA (several GB).
  - openmmforcefields
  - openff-toolkit
  - rdkit
  # Alternative multiprocessing backend for job_parallel
  - multiprocess
  # flexible_align(reordering=True)
  - rmsd
  - pytest
  - pytest-cov
  - python-build
  - pip:
      - geometric >=1.0.1
      # Fragment(smiles=...) and xyz_to_pdb_with_connectivity. Not from conda-forge:
      # it has no build past python 3.12. PyPI ships linux-x86_64 and macOS-arm64 wheels.
      - openbabel
