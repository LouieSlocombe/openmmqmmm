#   conda env create -f environment.yml && conda activate openmmqmmm && pip install -e .
#
# ORCA is not packaged here — install it separately and set OPENMMQMMM_ORCADIR. See README.md.
name: openmmqmmm
channels:
  - conda-forge
dependencies:
  # The OpenMM stack comes from conda-forge (pdbfixer is not on PyPI)
  - python>=3.10
  - pip
  - openmm >=8
  - pdbfixer
  - mdtraj
  - numpy
  - packaging
  - pytest
  - pytest-cov
  - python-build
  - pip:
      - geometric >=1.0.1
# Optional extras — uncomment as needed:
#  - openbabel           # Fragment(smiles=...) and small_molecule_parameterizer
#  - scipy               # occupation-entropy analysis in ORCATheory
#  - parmed              # Amber/GROMACS prmtop handling in OpenMMTheory
#  - openmmforcefields   # small_molecule_parameterizer (with openff-toolkit and rdkit)
#  - openff-toolkit
#  - rdkit
#  - openmm-plumed       # PLUMED-biased MD / metadynamics (openmm_md_plumed)
#  - multiprocess        # alternative multiprocessing backend for job_parallel
