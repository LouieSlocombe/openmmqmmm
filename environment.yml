# Conda environment for building, developing and running openmmqmmm.
#
# Usage (from the repository root):
#   conda env create -f environment.yml
#   conda activate openmmqmmm
#   pip install -e .
#
# ORCA is not packaged here — install it separately and set the
# OPENMMQMMM_ORCADIR environment variable (or put `orca` in PATH). See README.md.
name: openmmqmmm
channels:
  - conda-forge
dependencies:
  # Runtime — the OpenMM stack comes from conda-forge (pdbfixer is not on PyPI)
  - python>=3.10
  - pip
  - openmm >=8
  - pdbfixer
  - mdtraj
  - numpy
  - packaging
  # Development / build tooling
  - pytest
  - python-build
  - pip:
      # geomeTRIC optimizer
      - geometric >=1.0.1
# Optional extras — uncomment as needed:
#  - openbabel           # ligand format conversion (mol_to_pdb, small_molecule_parameterizer, ...)
#  - matplotlib          # metadynamics plots / Plot
#  - scipy               # occupation-entropy analysis in ORCATheory
#  - parmed              # Amber/GROMACS prmtop handling in OpenMMTheory
#  - openmmforcefields   # small_molecule_parameterizer (with openff-toolkit and rdkit)
#  - openff-toolkit
#  - rdkit
#  - openmm-plumed       # PLUMED-biased MD (openmm_md_plumed)
#  - multiprocess        # alternative multiprocessing backend for job_parallel
