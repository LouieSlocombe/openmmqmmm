# Conda environment for building, developing and running openmmqmmm.
#
# Usage (from the repository root):
#   conda env create -f environment.yml
#   conda activate openmmqmmm
#   pip install -e .
#
# ORCA is not packaged here — install it separately and make sure `orca` is in
# PATH (or set orcadir in ~/ash_user_settings.ini). See README.md.
name: openmmqmmm
channels:
  - conda-forge
dependencies:
  # Runtime — the OpenMM stack comes from conda-forge (pdbfixer is not on PyPI)
  - python=3.13
  - pip
  - openmm >=8
  - pdbfixer
  - mdtraj
  - numpy
  - packaging
  # Development / build tooling
  - pytest
  - python-build
  - pip:
      # geomeTRIC optimizer
      - geometric >=1.0.1
# Optional extras — uncomment as needed:
#  - openbabel     # ligand format conversion (small_molecule_parameterizer)
#  - matplotlib    # metadynamics plots / ASH_plot
#  - scipy         # occupation-entropy analysis in ORCATheory
#  - parmed        # Amber/GROMACS prmtop handling in OpenMMTheory
