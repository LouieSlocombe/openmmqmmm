#   bash conda_install.sh
#
# That script creates this environment, compiles PLUMED, the OpenMM-PLUMED plugin and
# py-plumed into it, and adds forcefill. See README.md in this directory for the other
# two routes and for what to do with an environment that already exists.
#
# ORCA is not packaged here — install it separately and set OPENMMQMMM_ORCADIR.
name: openmmqmmm
channels:
  - conda-forge
dependencies:
  # The OpenMM stack comes from conda-forge (pdbfixer's only binary route)
  - python>=3.10
  - pip
  # Atomic Simulation Environment integration
  - ase
  - openmm =8.5.2
  # PLUMED itself is absent on purpose: build_plumed.sh compiles it into the same
  # prefix, so a conda-forge copy would be silently overwritten by `make install`,
  # and that build omits the opes module openmm_md_plumed needs. These are the
  # source-build prerequisites for it and for the openmm-plumed plugin.
  - cmake
  - make
  - swig
  - cxx-compiler
  - doxygen
  # build_py_plumed regenerates the py-plumed C extension from its .pyx source.
  - cython
  - pdbfixer
  - mdtraj
  - numpy
  - scipy
  - packaging
  # Amber/CHARMM/GROMACS topology handling in OpenMMTheory
  - parmed
  # forcefill's dependency stack (openmm_modeller parameterize_nonstandard=True; see README.md).
  # forcefill itself is on neither index, so conda_install.sh clones it next to this
  # repository and installs it editable (see editable_repos.sh). Creating this environment
  # on its own leaves it out; CI installs it straight from GitHub, having no checkout.
  # openff-toolkit pulls ambertools (antechamber for the GAFF backend), which pulls
  # pytorch + CUDA (several GB).
  - openmmforcefields
  - openff-toolkit
  - rdkit
  # Alternative multiprocessing backend for job_parallel
  - multiprocess
  # flexible_align(reordering=True)
  - rmsd
  - pytest
  - pytest-cov
  - python-build
  - pip:
      - geometric >=1.0.1
      # Fragment(smiles=...) and xyz_to_pdb_with_connectivity. Not from conda-forge:
      # it has no build past python 3.12. PyPI ships linux-x86_64 and macOS-arm64 wheels.
      - openbabel
