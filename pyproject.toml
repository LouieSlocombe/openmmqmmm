[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmqmmm"
version = "0.99"
description = "ORCA + OpenMM QM/MM for biomolecular calculations (trimmed ASH distribution)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "R. Bjornsson", email = "ragnar.bjornsson@gmail.com" },
]
maintainers = [
    { name = "Louie Slocombe", email = "louie.l.slocombe@gmail.com" },
]
requires-python = ">= 3.10"
dependencies = [
    "numpy",
    "packaging",
    "geometric >= 1.0.1",
]

[project.optional-dependencies]
# The OpenMM stack is best installed from conda-forge (see environment.yml);
# pdbfixer in particular is not distributed on PyPI.
openmm = ["openmm >= 8", "mdtraj"]
extras = ["matplotlib", "scipy", "parmed"]
test = ["pytest"]

[project.urls]
Documentation = "https://ash.readthedocs.io"
Upstream = "https://github.com/RagnarB83/ash"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmqmmm*"]
exclude = ["openmmqmmm.tests*"]

# Non-Python files required at runtime. Test data (~32 MB under
# openmmqmmm/tests) is deliberately not shipped in wheels — run the test
# suite from a source checkout.
[tool.setuptools.package-data]
openmmqmmm = ["log.ini"]

[tool.pytest.ini_options]
testpaths = ["openmmqmmm/tests"]
addopts = "-ra"

# Lint rules are being adopted in stages during the modernization effort; the
# temporary ignores below shrink as each phase lands.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]
ignore = [
    # Temporary until the format/mechanical-lint phase:
    "E402", "E701", "E711", "E712", "E721", "E731", "F541", "F841", "E741",
    # Temporary until the crash-fix phase (these two flag real bugs fixed there):
    "F521", "F523",
    # Temporary until the exceptions phase:
    "E722",
]

[tool.ruff.lint.per-file-ignores]
# Tests use star imports until the API-rename phase makes imports explicit
"openmmqmmm/tests/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["openmmqmmm"]
