[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmqmmm"
version = "0.99"
description = "ORCA + OpenMM QM/MM for biomolecular calculations (trimmed ASH distribution)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "R. Bjornsson", email = "ragnar.bjornsson@gmail.com" },
]
maintainers = [
    { name = "Louie Slocombe", email = "louie.l.slocombe@gmail.com" },
]
requires-python = ">= 3.10"
dependencies = [
    "numpy",
    "packaging",
    "geometric >= 1.0.1",
    # openmm is required at import time (interface_OpenMM); conda-forge remains
    # the recommended install route for the full stack (pdbfixer is conda-only).
    "openmm >= 8",
]

[project.optional-dependencies]
md = ["mdtraj"]
extras = ["matplotlib", "scipy", "parmed"]
test = ["pytest"]

[project.urls]
Documentation = "https://ash.readthedocs.io"
Upstream = "https://github.com/RagnarB83/ash"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmqmmm*"]
exclude = ["openmmqmmm.tests*"]

# Non-Python files required at runtime. Test data (~32 MB under
# openmmqmmm/tests) is deliberately not shipped in wheels — run the test
# suite from a source checkout.
[tool.setuptools.package-data]
openmmqmmm = ["log.ini"]

[tool.pytest.ini_options]
testpaths = ["openmmqmmm/tests"]
addopts = "-ra"

# Lint rules are being adopted in stages during the modernization effort; the
# temporary ignores below shrink as each phase lands.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "A", "C4", "PIE", "SIM", "RUF", "FURB", "PLE", "PLW", "BLE", "T20", "G", "LOG"]
ignore = [
    # The formatter owns line wrapping; long scientific strings exist
    "E501",
    # Loop-variable reassignment pervades the file parsers
    "PLW2901",
    # f-strings in log calls are fine: the messages are the calculation record
    "G004",
]

[tool.ruff.lint.per-file-ignores]
# Tests use star imports until the API-rename phase makes imports explicit
"openmmqmmm/tests/*" = ["F403", "F405", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["openmmqmmm"]
