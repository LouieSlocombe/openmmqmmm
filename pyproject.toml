[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmqmmm"
version = "0.0.1"
description = "Template"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
  { name = "Louie Slocombe", email = "louies@hotmail.co.uk" },
]

dependencies = [
    'geometric >=1.0.1',
    'numpy',
    'packaging',
    'pytest',
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmqmmm"
Repository = "https://github.com/LouieSlocombe/openmmqmmm"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmqmmm", "openmmqmmm.*"]

[tool.setuptools.package-data]
"openmmqmmm" = ["data/*"]


[build-system]
requires = ["setuptools >=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ['openmmqmmm*', 'openmmqmmm.external', 'openmmqmmm.functions','openmmqmmm.interfaces','openmmqmmm.modules','openmmqmmm.tests']

[tool.setuptools.package-data]
"*" = ["*.*"] #
