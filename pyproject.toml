[build-system]
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "openmmqmmm"
version = "1.0.0"
description = "ORCA + OpenMM QM/MM for biomolecular calculations (derived from ASH)"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "R. Bjornsson", email = "ragnar.bjornsson@gmail.com" },
]
maintainers = [
    { name = "Louie Slocombe", email = "louie.l.slocombe@gmail.com" },
]
requires-python = ">= 3.12"
keywords = [
    "QM/MM",
    "computational chemistry",
    "quantum chemistry",
    "molecular dynamics",
    "ORCA",
    "OpenMM",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    # Calculator._directory and numpy.typing.NDArray, respectively.
    "ase >= 3.20.1",
    "numpy >= 1.21",
    "packaging",
    # openmmqmmm.constants derives every physical constant from scipy.constants (CODATA)
    "scipy",
    # IRC and rigid-body optimization.
    "geometric >= 1.1",
    # Required at import time.
    "openmm >= 8.6, < 8.7",
    "pdbfixer",
    "mdtraj",
    "parmed",
    "multiprocess",
    # Includes reorder_inertia_hungarian.
    "rmsd >= 1.4",
    # The adapters use the Python package layout introduced in Open Babel 3.
    "openbabel >= 3.0",
]

# Development tooling only. Every runtime dependency is required above, with two
# exceptions that pip cannot express: openmm-plumed and forcefill are not published to
# PyPI, so a pip-only install leaves openmm_md_plumed and
# openmm_modeller(parameterize_nonstandard=True) unavailable. build_tools/ covers both:
# environment.yml pulls forcefill's dependency stack (openff-toolkit, openmmforcefields,
# rdkit) and the PLUMED source-build prerequisites from conda-forge, and
# conda_install.sh compiles PLUMED and OpenMM-PLUMED against OpenMM 8.6 and installs
# forcefill editable from a checkout next to this repository.
[project.optional-dependencies]
# pytest-cov 6 supplies coverage>=7.5 for exclude_also below; pytest 8.3 is the first
# release that runs on the 3.13 leg of the CI matrix.
test = ["pytest >= 8.3", "pytest-cov >= 6"]
# Pin must match .pre-commit-config.yaml and ci.yml: ruff's formatter output shifts
# between releases, so a skew lets a locally-clean tree fail the CI format gate.
# pre-commit-hooks v5.0.0 requires pre-commit 3.2.0.
dev = ["ruff == 0.16.2", "pre-commit >= 3.2.0"]
# Sphinx only. The docs build also needs every runtime dependency above, because
# conf.py mocks nothing and autodoc imports the package; `pip install -e ".[docs]"`
# from a checkout covers both halves.
docs = [
    "sphinx >= 8.1",
    "furo >= 2024.8.6",
    "myst-parser >= 4.0",
    "sphinx-copybutton >= 0.5.2",
]

[project.urls]
Homepage = "https://github.com/LouieSlocombe/openmmqmmm"
Documentation = "https://openmmqmmm.readthedocs.io"
Repository = "https://github.com/LouieSlocombe/openmmqmmm.git"
Issues = "https://github.com/LouieSlocombe/openmmqmmm/issues"
Upstream = "https://github.com/RagnarB83/ash"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmmqmmm*"]

# Wheels ship the geomeTRIC compatibility logging config and the PEP 561 marker. Test data
# (~2.5 MB under tests/) is repository-only — run the suite from a checkout.
[tool.setuptools.package-data]
openmmqmmm = ["log.ini", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# Configured here so `pytest --cov` reports the same numbers locally and in CI.
[tool.coverage.run]
source = ["openmmqmmm"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py312"

# Ruff's current defaults, pinned so a future release cannot silently reformat the tree.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "SIM", "RUF", "FURB",
    "PLE", "PLW", "BLE", "T20", "G", "LOG",
    # Docstring shape only; presence is not checked here — see the D1xx ignores.
    "D",
    "ICN", "TID", "PYI", "RSE", "FA", "PGH", "DTZ", "EXE", "INT", "ISC", "ERA",
    "PLR2044",
    "RET", "PERF", "PLR1714", "PLR5501", "PLR1711", "PLC1802",
    # Keep the package's inline type annotations complete.
    "ANN",
]
ignore = [
    # INFO records use f-strings for aligned scientific tables; DEBUG calls stay lazy
    "G004",
    # Uppercase locals are idiomatic in the physics-heavy code
    "N806",
    # Docstring presence is enforced by tests/test_api_docs.py against the public API
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # Formatter-incompatible. Implicit concatenation keeps long output templates
    # under line-length; do not add COM or Q here for the same reason.
    "ISC001",
    # Dynamic theory adapters and third-party scientific APIs do not always expose
    # a useful common protocol, so Any remains valid at those integration seams.
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# Tests and the runnable examples may print.
"tests/*" = ["T20", "ANN"]
"examples/*" = ["T20", "ANN"]
# __all__ is grouped semantically, not alphabetically
"openmmqmmm/__init__.py" = ["RUF022"]
# Mathematical/physics argument notation (A, B, C, T, Qcoord, Lgrad, ...)
"openmmqmmm/coords.py" = ["N803"]
"openmmqmmm/freq.py" = ["N803"]
"openmmqmmm/qmmm.py" = ["N803"]

[tool.ruff.lint.isort]
known-first-party = ["openmmqmmm"]

[tool.ruff.lint.pydocstyle]
convention = "google"
