name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Must match the ruff rev in .pre-commit-config.yaml and the `dev` extra in pyproject.toml.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
          args: "check ."
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"
          args: "format --check ."

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: build_tools/environment.yml
          create-args: python=${{ matrix.python }}
          cache-environment: true
      - run: pip install -e . --no-deps
      # The installers in build_tools/ clone forcefill next to the repository and install
      # it editable; a runner has only this repository checked out, so CI takes it from
      # GitHub instead.
      - run: pip install --no-deps "forcefill @ git+https://github.com/LouieSlocombe/forcefill.git@bff20e2498474b3b3aa965b090fa722f762a49ae"
      - run: python -c "import openmmqmmm"
      # The no-ORCA number is 53% (57% with ORCA); the floor sits well below it so
      # coverage-neutral PRs pass. The four end-to-end QM/MM tests skip here since no
      # orca binary exists in CI.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  # A wheel that imports is not the same as an editable checkout that imports: this
  # catches packaging mistakes such as a missing package-data entry.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: build_tools/environment.yml
          cache-environment: true
      - run: python -m build
      - name: Validate source-distribution contents and examples
        run: |
          python -m compileall -q examples
          python -c "import glob, tarfile; names = tarfile.open(glob.glob('dist/*.tar.gz')[0]).getnames(); assert any(name.endswith('/build_tools/conda_install.sh') for name in names); assert any(name.endswith('/examples/gasphase_hf.py') for name in names); assert not any('/build_tools/sources/' in name for name in names)"
      - name: Install the built wheel and import it
        run: |
          pip install --force-reinstall --no-deps dist/*.whl
          cd "$(mktemp -d)"  # import from outside the source tree
          python -c "import ase"
          python -c "import openmmqmmm; print(openmmqmmm.__version__)"
          python -c "import importlib.resources as r; assert r.files('openmmqmmm').joinpath('log.ini').is_file()"
          python -c "import importlib.resources as r; assert r.files('openmmqmmm').joinpath('py.typed').is_file()"
      - name: Install the built source distribution and import it
        run: |
          pip install --force-reinstall --no-deps --no-build-isolation dist/*.tar.gz
          cd "$(mktemp -d)"
          python -c "import openmmqmmm; print(openmmqmmm.__version__)"
